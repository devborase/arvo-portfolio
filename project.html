<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, #050816, #0b1020);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        body.loaded {
            opacity: 1;
        }

        body.fade-out {
            opacity: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #b0b8d4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 30px;
        }

        .photo {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo .caption {
            padding: 14px;
            color: #b0b8d4;
        }

        .ppt-viewer {
            margin-top: 28px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
        }

        .ppt-viewer iframe {
            width: 100%;
            height: min(75vh, 800px);
            border: 0;
            display: block;
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            color: white;
            background: #00d2ff;
        }

        .btn.secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html#work" id="backLink">← Back to Projects</a>
        <h1 id="projectTitle">Project Gallery</h1>
        <p id="projectDesc">Project photos and files.</p>

        <div id="viewerWrap"></div>

        <div class="gallery">
            <div class="photo">
                <img src="PROJECT_TRUCK_RIM/Screenshot 2026-05-04 015726.png" alt="Project photo 1">
                <div class="caption">Project photo 1</div>
            </div>
            <div class="photo">
                <img src="images/project2.jpg" alt="Project photo 2">
                <div class="caption">Project photo 2</div>
            </div>
            <div class="photo">
                <img src="images/project3.jpg" alt="Project photo 3">
                <div class="caption">Project photo 3</div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');

        const data = {
            bumper: {
                title: 'Automotive Front Bumper Fascia',
                desc: 'Complete plastic component design from Class-A surfaces to a closed volume with defined clearance lines.',
                ppt: 'ppt/bumper.pptx',
                slidesUrl: 'https://docs.google.com/gview?url=https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/ppt/bumper.pptx&embedded=true'
            },
            automotive: {
                title: 'High-Performance Automotive Modeling',
                desc: 'Advanced surfacing and 3D geometric modeling for vehicle components and body panels.',
                ppt: 'ppt/automotive.pptx',
                slidesUrl: 'https://docs.google.com/gview?url=https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/ppt/automotive.pptx&embedded=true'
            },
            thermal: {
                title: 'Thermal Optimization of Truck Wheel Rim',
                desc: 'CFD analysis and thermal optimization modeling for improved heat dissipation.',
                ppt: 'ppt/thermal.pptx',
                slidesUrl: 'https://docs.google.com/gview?url=https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/ppt/thermal.pptx&embedded=true'
            }
        };

        const current = data[name];

        if (current) {
            document.getElementById('projectTitle').textContent = current.title;
            document.getElementById('projectDesc').textContent = current.desc;

            document.getElementById('viewerWrap').innerHTML = `
                <div class="ppt-viewer">
                    <iframe src="${current.slidesUrl}" allowfullscreen></iframe>
                </div>
                <div class="actions">
                    <a class="btn" href="${current.ppt}" download>Download PPT</a>
                    <a class="btn secondary" href="${current.ppt}" target="_blank" rel="noopener noreferrer">Open PPT File</a>
                </div>
            `;
        }

        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        document.getElementById('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = this.href;
            }, 250);
        });
    </script>
</body>
</html>
