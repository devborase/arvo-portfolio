<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Presentation</title>
    <style>
        :root {
            --bg: #050816;
            --bg-2: #0b1020;
            --card: rgba(15, 20, 38, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f7f9ff;
            --muted: #b0b8d4;
            --accent: #00d2ff;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, var(--bg), var(--bg-2));
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        body {
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
        }

        p {
            color: var(--muted);
            margin-top: 0;
        }

        .viewer {
            margin-top: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .slide-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        .slide-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #111;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html#work" id="backLink">← Back to Projects</a>
        <h1 id="projectTitle">Project Presentation</h1>
        <p id="projectDesc">Presentation preview.</p>

        <div class="viewer">
            <div class="slide-wrap">
                <iframe id="slideFrame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

           },
            central: {

            },
            ac: {

                slidesUrl: 'https://docs.google.com/gview?url=https://devborase.github.io/arvo-portfolio/ppt/AC%20Front%20Control%20Panel%20Design%20Report.pptx&embedded=true'
            },

            },

            },

           },
           ooo: {
                title: 'B Surface Features Report',
                desc: 'Complete plastic component design from Class-A surfaces to a closed volume with defined clearance lines.',
                slidesUrl: 'https://docs.google.com/gview?url=https://devborase.github.io/arvo-portfolio/ppt/Automotive%20Modeling%20Report.pptx&embedded=true'
           },
            kkk: {

                desc: 'Complete plastic component design from Class-A surfaces to a closed volume with defined clearance lines.',

           },
            thermal: {
                title: 'Thermal Optimization of Truck Wheel Rim',
                desc: 'CFD analysis and thermal optimization modeling for improved heat dissipation.',
                slidesUrl: 'https://docs.google.com/gview?url=https://devborase.github.io/arvo-portfolio/ppt/tim.pptxx&embedded=true'
            }
        };

        const current = data[name] || {
            title: 'Project Presentation',
            desc: 'Presentation preview.',
            slidesUrl: ''
        };

        document.getElementById('projectTitle').textContent = current.title;
        document.getElementById('projectDesc').textContent = current.desc;
        document.getElementById('slideFrame').src = current.slidesUrl;

        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        document.getElementById('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = this.href;
            }, 250);
        });
    </script>
</body>
</html>
