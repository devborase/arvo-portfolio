<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, #050816, #0b1020);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        body.loaded {
            opacity: 1;
        }

        body.fade-out {
            opacity: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #b0b8d4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 30px;
        }

        .photo {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo .caption {
            padding: 14px;
            color: #b0b8d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html#work" id="backLink">← Back to Projects</a>
        <h1 id="projectTitle">Project Gallery</h1>
        <p id="projectDesc">Select a project to view details.</p>

        <div id="viewerWrap"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');

        const data = {
            bumper: {
                title: 'Automotive Front Bumper Fascia',
                desc: 'Complete plastic component design from Class-A surfaces to a closed volume with defined clearance lines.'
            },
            automotive: {
                title: 'High-Performance Automotive Modeling',
                desc: 'Advanced surfacing and 3D geometric modeling for vehicle components and body panels.'
            },
            thermal: {
                title: 'Thermal Optimization of Truck Wheel Rim',
                desc: 'CFD analysis and thermal optimization modeling for improved heat dissipation.'
            }
        };

        const current = data[name];

        if (current) {
            document.getElementById('projectTitle').textContent = current.title;
            document.getElementById('projectDesc').textContent = current.desc;
            document.getElementById('viewerWrap').innerHTML = '';
        }

        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        document.getElementById('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = this.href;
            }, 250);
        });
    </script>
</body>
</html>
