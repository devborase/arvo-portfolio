<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Presentation</title>
    <style>
        :root {
            --bg: #050816;
            --bg-2: #0b1020;
            --card: rgba(15, 20, 38, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f7f9ff;
            --muted: #b0b8d4;
            --accent: #00d2ff;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, var(--bg), var(--bg-2));
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        body {
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
        }

        p {
            color: var(--muted);
            margin-top: 0;
        }

        .viewer {
            margin-top: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .slide-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #111;
        }

        .hint {
            margin-top: 14px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .thumbs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .thumb {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s ease;
            background: #111;
        }

        .thumb.active,
        .thumb:hover {
            opacity: 1;
            border-color: var(--accent);
        }

        .thumb span {
            display: block;
            padding: 12px 8px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html#work" id="backLink">← Back to Projects</a>
        <h1 id="projectTitle">Project Presentation</h1>
        <p id="projectDesc">Scroll on the slide area to change slides.</p>

        <div class="viewer">
            <div class="slide-wrap" id="slideArea" tabindex="0">
                <iframe id="slideFrame" src="" allowfullscreen></iframe>
            </div>

            <div class="hint">Use mouse wheel or touchpad scroll over the slide area to move between slides.</div>
            <div class="thumbs" id="thumbs"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');

        const data = {
            bumper: {
                title: 'Automotive Front Bumper Fascia',
                desc: 'Scroll through the presentation slides for the bumper project.',
                ppt: 'ppt/Front Bumper  Design Report.pptx',
                slidesUrl: [
                    'https://devborase.github.io/arvo-portfolio/ppt/Front%20Bumper%20Design%20Report/slide1.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Front%20Bumper%20Design%20Report/slide2.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Front%20Bumper%20Design%20Report/slide3.png?raw=true&embedded=true'
                ]
            },
            automotive: {
                title: 'High-Performance Automotive Modeling',
                desc: 'Scroll through the presentation slides for the automotive modeling project.',
                ppt: 'Automotive Modeling Report.pptx',
                slidesUrl: [
                    'https://devborase.github.io/arvo-portfolio/ppt/Automotive%20Modeling%20Report/slide1.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Automotive%20Modeling%20Report/slide2.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Automotive%20Modeling%20Report/slide3.png?raw=true&embedded=true'
                ]
            },
            thermal: {
                title: 'Thermal Optimization of Truck Wheel Rim',
                desc: 'Scroll through the presentation slides for the thermal optimization project.',
                ppt: 'Thermal Optimization Report.pptx',
                slidesUrl: [
                    'https://devborase.github.io/arvo-portfolio/ppt/Thermal%20Optimization%20Report/slide1.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Thermal%20Optimization%20Report/slide2.png?raw=true&embedded=true',
                    'https://devborase.github.io/arvo-portfolio/ppt/Thermal%20Optimization%20Report/slide3.png?raw=true&embedded=true'
                ]
            }
        };

        const current = data[name] || {
            title: 'Project Presentation',
            desc: 'Scroll on the slide area to change slides.',
            ppt: '',
            slidesUrl: []
        };

        const projectTitle = document.getElementById('projectTitle');
        const projectDesc = document.getElementById('projectDesc');
        const slideFrame = document.getElementById('slideFrame');
        const thumbs = document.getElementById('thumbs');
        const slideArea = document.getElementById('slideArea');

        projectTitle.textContent = current.title;
        projectDesc.textContent = current.desc;

        let index = 0;
        let wheelLock = false;

        function renderSlide() {
            if (!current.slidesUrl.length) {
                slideFrame.removeAttribute('src');
                thumbs.innerHTML = '<p style="color:#b0b8d4;">Add slide URLs in the data object to display the presentation.</p>';
                return;
            }

            slideFrame.src = current.slidesUrl[index];

            thumbs.querySelectorAll('.thumb').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        thumbs.innerHTML = current.slidesUrl.map((src, i) => `
            <div class="thumb ${i === 0 ? 'active' : ''}" data-index="${i}">
                <span>Slide ${i + 1}</span>
            </div>
        `).join('');

        thumbs.querySelectorAll('.thumb').forEach(thumb => {
            thumb.addEventListener('click', () => {
                index = Number(thumb.dataset.index);
                renderSlide();
            });
        });

        slideArea.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (wheelLock || !current.slidesUrl.length) return;

            wheelLock = true;

            if (e.deltaY > 0 && index < current.slidesUrl.length - 1) {
                index++;
                renderSlide();
            } else if (e.deltaY < 0 && index > 0) {
                index--;
                renderSlide();
            }

            setTimeout(() => {
                wheelLock = false;
            }, 350);
        }, { passive: false });

        renderSlide();

        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        document.getElementById('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = this.href;
            }, 250);
        });
    </script>
</body>
</html>
