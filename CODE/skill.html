<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Gallery</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, #050816, #0b1020);
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #b0b8d4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 30px;
        }

        .photo {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo .caption {
            padding: 14px;
            color: #b0b8d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html#skills" id="backLink">← Back to Skills</a>
        <h1 id="skillTitle">Skill Gallery</h1>
        <p id="skillDesc">Photos and files related to this skill.</p>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const skill = params.get('skill');

        const data = {
            nx: {
                title: 'Siemens NX',
                desc: 'Gallery for Siemens NX design files and photos.',
                images: ['images/nx/1.jpg', 'images/nx/2.jpg', 'images/nx/3.jpg']
            },
            solidworks: {
                title: 'SolidWorks',
                desc: 'Gallery for SolidWorks design files and photos.',
                images: ['images/solidworks/1.jpg', 'images/solidworks/2.jpg', 'images/solidworks/3.jpg']
            },
            catia: {
                title: 'CATIA',
                desc: 'Gallery for CATIA design files and photos.',
                images: ['images/catia/1.jpg', 'images/catia/2.jpg', 'images/catia/3.jpg']
            },
            creo: {
                title: 'PTC Creo',
                desc: 'Gallery for Creo design files and photos.',
                images: ['images/creo/1.jpg', 'images/creo/2.jpg', 'images/creo/3.jpg']
            },
            cfd: {
                title: 'CFD Analysis',
                desc: 'Gallery for CFD analysis images and results.',
                images: ['images/cfd/1.jpg', 'images/cfd/2.jpg', 'images/cfd/3.jpg']
            },
            surface: {
                title: 'Surface Modeling',
                desc: 'Gallery for surface modeling files and photos.',
                images: ['images/surface/1.jpg', 'images/surface/2.jpg', 'images/surface/3.jpg']
            },
            tooling: {
                title: 'Tooling Feasibility',
                desc: 'Gallery for tooling feasibility photos and documents.',
                images: ['images/tooling/1.jpg', 'images/tooling/2.jpg', 'images/tooling/3.jpg']
            },
            cavity: {
                title: 'Core & Cavity Extraction',
                desc: 'Gallery for core and cavity extraction files and photos.',
                images: ['images/cavity/1.jpg', 'images/cavity/2.jpg', 'images/cavity/3.jpg']
            },
            gdt: {
                title: 'GD&T',
                desc: 'Gallery for GD&T drawings and photos.',
                images: ['images/gdt/1.jpg', 'images/gdt/2.jpg', 'images/gdt/3.jpg']
            },
            assembly: {
                title: 'Assembly Modeling',
                desc: 'Gallery for assembly modeling files and photos.',
                images: ['images/assembly/1.jpg', 'images/assembly/2.jpg', 'images/assembly/3.jpg']
            }
        };

        const current = data[skill] || {
            title: 'Skill Gallery',
            desc: 'Photos and files related to this skill.',
            images: []
        };

        document.getElementById('skillTitle').textContent = current.title;
        document.getElementById('skillDesc').textContent = current.desc;

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = current.images.map((src, i) => `
            <div class="photo">
                <img src="${src}" alt="${current.title} ${i + 1}">
                <div class="caption">${current.title} photo ${i + 1}</div>
            </div>
        `).join('');

        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        document.getElementById('backLink').addEventListener('click', function (e) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = this.href;
            }, 250);
        });
    </script>
</body>
</html>
